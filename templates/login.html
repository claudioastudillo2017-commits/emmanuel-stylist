<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{background:#111;color:#fff;font-family:Arial;margin:0;padding:20px}header{display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse;margin-top:20px;background:#1e1e1e}th,td{padding:10px;border:1px solid #333;font-size:14px}th{background:#c9a86a;color:#000}a{color:#e74c3c;text-decoration:none}.logout{color:#c9a86a}</style></head><body><header><h1 style="color:#c9a86a">Turnos</h1><a class="logout" href="/logout">Salir</a></header><table><tr><th>Nombre</th><th>Tel</th><th>Fecha</th><th>Hora</th><th>Servicio</th><th>X</th></tr>{% for t in turnos %}<tr><td>{{t['nombre']}}</td><td>{{t['telefono']}}</td><td>{{t['fecha']}}</td><td>{{t['hora']}}</td><td>{{t['servicio']}}</td><td><a href="/borrar/{{t['id']}}">Borrar</a></td></tr>{% endfor %}</table></body></html>
